archiver {
  shutdownGracePeriod = 5
  shutdownGracePeriod = ${?ARCHIVER_SHUTDOWN_GRACE_PERIOD}

  flushIntervalMs = 30000
  flushIntervalMs = ${?ARCHIVER_FLUSH_INTERVAL_MS}

  stagingDir = "/tmp/pulse-archiver"
  stagingDir = ${?ARCHIVER_STAGING_DIR}

  stagingMaxBytes = 2147483648
  stagingMaxBytes = ${?ARCHIVER_STAGING_MAX_BYTES}
}
