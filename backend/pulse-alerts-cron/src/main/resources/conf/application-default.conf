app {
    pulseServerUrl = ${CONFIG_SERVICE_APPLICATION_PULSESERVERURL}
    shutdownGracePeriod = 5
    serviceJwtSecret = ${?CONFIG_SERVICE_APPLICATION_SERVICEJWTSECRET}
    # Usage credits → Redis: POST is async (202); pulse-server dedupes overlapping work. Default 5s.
    usageCreditsSyncIntervalSeconds = 5
    # API keys → Redis: same pattern. Default 600s (10 minutes).
    apiKeysSyncIntervalSeconds = 600
}
