receivers:
  kafka:
    brokers:
      - pulse-kafka-01.pulse.local:9092
      - pulse-kafka-02.pulse.local:9092
    protocol_version: "3.5.0"
    client_id: otel-clickhouse-writer
    group_id: otel-clickhouse-writer
    initial_offset: latest

    # Traces from pulse.traces
    traces:
      topic: pulse.traces
      encoding: otlp_proto    # must match exporter encoding from otel-collector-1

    # Metrics from pulse.metrics
    metrics:
      topic: pulse.metrics
      encoding: otlp_proto

    # Logs (only the "other" logs)
    logs:
      topic: pulse.logs
      encoding: otlp_proto

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    send_batch_size: 50000
    timeout: 10s
    send_batch_max_size: 75000

exporters:
  clickhouse:
    # driven by env vars from docker-compose
    endpoint: tcp://shard-1-replica-1.pulse-clickhouse.delivr.local:9000
    database: otel
    username: pulseuser
    password: Q7mX2pN9zHa4

    create_schema: false
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    metrics_table_name: otel_metrics_gauge
    async_insert: false
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: detailed

service:
  extensions: [ health_check ]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [ kafka ]
      processors: [ batch ]
      exporters: [ clickhouse, debug]

    metrics:
      receivers: [ kafka ]
      processors: [ batch ]
      exporters: [ clickhouse, debug]

    logs:
      receivers: [ kafka ]
      processors: [ batch ]
      exporters: [ clickhouse, debug]