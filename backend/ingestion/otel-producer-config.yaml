# OpenTelemetry Collector Contrib 0.137.0 — production template
# GeoIP processor: alpha; requires MaxMind GeoLite2-City or GeoIP2-City .mmdb at GEOIP_DATABASE_PATH.
# Kong / edge must forward X-Forwarded-For; include_metadata exposes it as metadata.x-forwarded-for.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        # Required for attributes processor: from_context metadata.x-forwarded-for
        include_metadata: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  # Map X-Forwarded-For into client.address (semconv) for geoipprocessor
  attributes/client_ip:
    actions:
      - key: client.address
        action: upsert
        from_context: metadata.x-forwarded-for

  # v0.137.0 geoipprocessor: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.137.0/processor/geoipprocessor
  geoip:
    context: record
    providers:
      maxmind:
        database_path: /var/lib/otelcol-contrib/GeoLite2-City.mmdb
    # Default lookup keys include client.address; explicit list is optional
    attributes: [client.address, source.address]

  batch:
    send_batch_size: 1000
    timeout: 5s
    send_batch_max_size: 1500

exporters:
  # ---------------- Single Kafka exporter for traces + metrics --------
  kafka/pulse:
    brokers: ["pulse-kafka-01.pulse.local:9092", "pulse-kafka-02.pulse.local:9092"]          # make sure this matches your Kafka service/port
    protocol_version: "3.5.0"        # set to your Kafka cluster version

    # Per-signal config
    traces:
      topic: "pulse.traces"
      encoding: otlp_proto           # ExportTraceServiceRequest

    metrics:
      topic: "pulse.metrics"
      encoding: otlp_proto           # ExportMetricsServiceRequest

    logs:
      topic: "pulse.logs"
      encoding: otlp_proto

  otlphttp/pulse:
    endpoint: http://pulse-server.pulse.local
    tls:
      insecure: true
    compression: gzip
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 1000
  debug:
    verbosity: detailed

connectors:
  routing/pulse:
    # Logs that do NOT match the rule below go here by default
    default_pipelines: [ logs/to-other-logs ]

    table:
      - context: log
        # Match ANR / crash / non_fatal logs based on pulse.type
        statement: >
          route()
          where attributes["pulse.type"] != nil
            and (
              attributes["pulse.type"] == "device.anr" or
              attributes["pulse.type"] == "device.crash" or
              attributes["pulse.type"] == "non_fatal"
            )
        # These logs go to the ANR/Crash pipeline
        pipelines: [ logs/to-backend ]

service:
  extensions: [ health_check ]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    # ---------------- Traces ----------------
    traces:
      receivers: [ otlp ]
      processors: [ attributes/client_ip, geoip, batch ]
      exporters: [ kafka/pulse, debug]

    # ---------------- Metrics ---------------
    metrics:
      receivers: [ otlp ]
      processors: [ attributes/client_ip, geoip, batch ]
      exporters: [ kafka/pulse ,debug]

    # -------- Entry pipeline for logs (enrich before connector so HTTP metadata is available) -------
    logs/in:
      receivers: [ otlp ]
      processors: [ attributes/client_ip, geoip ]
      exporters: [ routing/pulse , debug]

    # Matched: ANR / Crash / non_fatal logs
    logs/to-backend:
      receivers: [ routing/pulse ]
      processors: [ batch ]
      exporters: [ otlphttp/pulse ]

    # Default: all other logs
    # -> Kafka topic pulse.logs.other
    logs/to-other-logs:
      receivers: [ routing/pulse ]
      processors: [ batch ]
      exporters: [ kafka/pulse ]
