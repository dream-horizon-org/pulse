app {
    cronManagerBaseUrl=${CONFIG_SERVICE_APPLICATION_CRONMANAGERBASEURL}
    serviceUrl=${CONFIG_SERVICE_APPLICATION_SERVICEURL}
    googleOAuthClientId=${CONFIG_SERVICE_APPLICATION_GOOGLEOAUTHCLIENTID}
    googleOAuthEnabled=${CONFIG_SERVICE_APPLICATION_GOOGLEOAUTHENABLED}
    jwtSecret=${CONFIG_SERVICE_APPLICATION_JWTSECRET}
    encryptionMasterKey=${ENCRYPTION_MASTER_KEY}
    s3BucketName=${S3_BUCKET_NAME}
    configDetailsS3BucketFilePath=${CONFIG_DETAILS_S3_FILE_PATH}
    cloudFrontDistributionId=${CLOUDFRONT_DISTRIBUTION_ID}
    configDetailCloudFrontAssetPath=${CONFIG_CLOUDFRONT_ASSET_PATH}
    webhookUrl=${CONFIG_SERVICE_APPLICATION_WEBHOOKURL}
    interactionDetailsS3BucketFilePath=${INTERACTION_DETAILS_S3_FILE_PATH}
    interactionDetailCloudFrontAssetPath=${INTERACTION_CLOUDFRONT_ASSET_PATH}
    interactionConfigUrl=${INTERACTION_CONFIG_URL}
    logsCollectorUrl=${LOGS_COLLECTOR_URL}
    metricCollectorUrl=${METRIC_COLLECTOR_URL}
    spanCollectorUrl=${SPAN_COLLECTOR_URL}
    customEventCollectorUrl=${CUSTOM_EVENT_COLLECTOR_URL}
    firebaseProjectId=${CONFIG_SERVICE_APPLICATION_GCP_PROJECT_ID}
    tncS3BucketName=${S3_BUCKET_NAME}
}

# Root Cause Analysis (segment selection and cache)
rootCause {
    firstDimensionThresholdPct=75
    addDimensionThresholdPct=75
    lookbackDays=7
    cacheTtlHours=24
    firstDimensionThresholdPct=${?ROOT_CAUSE_FIRST_DIMENSION_THRESHOLD_PCT}
    addDimensionThresholdPct=${?ROOT_CAUSE_ADD_DIMENSION_THRESHOLD_PCT}
    lookbackDays=${?ROOT_CAUSE_LOOKBACK_DAYS}
    cacheTtlHours=${?ROOT_CAUSE_CACHE_TTL_HOURS}
}

# OpenFGA Authorization Configuration
openfga {
    apiUrl=${?OPENFGA_API_URL}
    storeId=${?OPENFGA_STORE_ID}
    authorizationModelId=${?OPENFGA_MODEL_ID}
    enabled=${?OPENFGA_ENABLED}
}