# All keys resolve from environment (see deploy/.env.example). For local/dev use enabled=false
# and empty string for ARNs/IDs; compose defaults supply values. Production requires enabled=true
# and non-blank values (see StartupConfigValidator).
emrServerless {
  enabled = ${CONFIG_SERVICE_APPLICATION_EMR_SERVERLESS_ENABLED}
  region = ${CONFIG_SERVICE_APPLICATION_EMR_SERVERLESS_REGION}
  applicationId = ${CONFIG_SERVICE_APPLICATION_EMR_SERVERLESS_APPLICATION_ID}
  jobRoleArn = ${CONFIG_SERVICE_APPLICATION_EMR_SERVERLESS_JOB_ROLE_ARN}
  executionRoleArn = ${CONFIG_SERVICE_APPLICATION_EMR_SERVERLESS_EXECUTION_ROLE_ARN}
}
