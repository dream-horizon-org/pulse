# Root Cause Analysis (RCA) - alternate approach. Endpoint is always active when this code is deployed.
rootCause {
  similarityThresholdPct = 75
  similarityThresholdPct = ${?ROOT_CAUSE_SIMILARITY_THRESHOLD_PCT}
  lookbackDays = 7
  lookbackDays = ${?ROOT_CAUSE_LOOKBACK_DAYS}
  maxSegments = 5
  maxSegments = ${?ROOT_CAUSE_MAX_SEGMENTS}
  hybridDimensionOrderingEnabled = true
  hybridDimensionOrderingEnabled = ${?ROOT_CAUSE_HYBRID_DIMENSION_ORDERING_ENABLED}
  minPoorSessionsForErrorAttribution = 1000
  minPoorSessionsForErrorAttribution = ${?ROOT_CAUSE_MIN_POOR_SESSIONS_ERROR_ATTRIBUTION}
  # Error-attribution drill-down (Mode A); see RootCauseConfig defaults and MainVerticle.buildRootCauseConfig
  minTreatedSessionsForIssueAttribution = 5
  minTreatedSessionsForIssueAttribution = ${?ROOT_CAUSE_MIN_TREATED_SESSIONS_ISSUE_ATTRIBUTION}
  minControlSessionsForIssueAttribution = 0
  minControlSessionsForIssueAttribution = ${?ROOT_CAUSE_MIN_CONTROL_SESSIONS_ISSUE_ATTRIBUTION}
  issueDrillDownLimit = 5
  issueDrillDownLimit = ${?ROOT_CAUSE_ISSUE_DRILL_DOWN_LIMIT}
  issueDrillDownCandidateLimit = 30
  issueDrillDownCandidateLimit = ${?ROOT_CAUSE_ISSUE_DRILL_DOWN_CANDIDATE_LIMIT}
  minRiskRatioForIssueAttribution = 2.0
  minRiskRatioForIssueAttribution = ${?ROOT_CAUSE_MIN_RISK_RATIO_ISSUE_ATTRIBUTION}
  # Minimum n_treated / n_u for merged error-attribution rows (φ = 0.05%). Set to 0 to disable.
  minTreatedPrevalenceFractionInU = 0.0005
  minTreatedPrevalenceFractionInU = ${?ROOT_CAUSE_MIN_TREATED_PREVALENCE_FRACTION_IN_U}
  # Pre-LLM segment gates are fixed in code (interaction / screen): raw driver vs baseline (>).
  issueMustPrecedePoor = true
  issueMustPrecedePoor = ${?ROOT_CAUSE_ISSUE_MUST_PRECEDE_POOR}
  dimensionOrder = ["Platform", "OsVersion", "AppVersion", "DeviceModel", "NetworkProvider", "GeoState"]
}
