# Multi-tenancy Configuration
# This config enables per-tenant connection pooling and encryption

multitenancy {
    # Encryption Master Key - REQUIRED for credential encryption/decryption
    # Must be set as environment variable: ENCRYPTION_MASTER_KEY
    # Generate with: openssl rand -hex 32
    encryptionMasterKey = ${ENCRYPTION_MASTER_KEY}
    
    # Tenant Connection Pool Configuration
    tenantPooling {
        # Minimum connections per tenant pool
        minPoolSize = ${TENANT_POOL_MIN_SIZE:2}
        
        # Maximum connections per tenant pool
        maxPoolSize = ${TENANT_POOL_MAX_SIZE:5}
        
        # Admin pool size (shared pool for non-tenant operations)
        adminPoolSize = ${ADMIN_POOL_SIZE:10}
        
        # Connection idle timeout in milliseconds
        idleTimeoutMs = ${TENANT_POOL_IDLE_TIMEOUT_MS:300000}
        
        # Connection acquisition timeout in milliseconds
        acquireTimeoutMs = ${TENANT_POOL_ACQUIRE_TIMEOUT_MS:10000}
        
        # Validation query to test connection health
        validationQuery = ${TENANT_POOL_VALIDATION_QUERY:"SELECT 1"}
    }
    
    # Credential Encryption Settings
    encryption {
        # Algorithm used for encryption (must be AES)
        algorithm = ${ENCRYPTION_ALGORITHM:"AES"}
        
        # Cipher mode
        cipherMode = ${ENCRYPTION_CIPHER_MODE:"AES/CBC/PKCS5Padding"}
        
        # Key derivation iterations for PBKDF2
        pbkdf2Iterations = ${ENCRYPTION_PBKDF2_ITERATIONS:10000}
        
        # Salt length in bytes
        saltLengthBytes = ${ENCRYPTION_SALT_LENGTH:16}
    }
    
    # Database Configuration for Tenant Credentials
    database {
        # Table name for storing tenant credentials
        credentialsTable = ${TENANT_CREDENTIALS_TABLE:"clickhouse_tenant_credentials"}
        
        # Table name for audit logs
        auditTable = ${TENANT_AUDIT_TABLE:"clickhouse_credential_audit"}
        
        # Enable audit logging for credential operations
        auditLoggingEnabled = ${TENANT_AUDIT_LOGGING_ENABLED:true}
    }
    
    # ClickHouse Multi-tenancy Settings
    clickhouse {
        # Prefix for tenant users created in ClickHouse
        tenantUserPrefix = ${CLICKHOUSE_TENANT_PREFIX:"tenant_"}
        
        # Database containing tenant-specific data
        tenantDatabase = ${CLICKHOUSE_TENANT_DATABASE:"default"}
        
        # Enable row-level security policies
        rowLevelSecurityEnabled = ${CLICKHOUSE_RLS_ENABLED:true}
    }
    
    # Feature Flags
    features {
        # Enable multi-tenancy support
        multitenancyEnabled = ${MULTITENANCY_ENABLED:true}
        
        # Enable tenant isolation validation
        isolationValidationEnabled = ${ISOLATION_VALIDATION_ENABLED:true}
        
        # Enable connection pool statistics
        poolStatsEnabled = ${POOL_STATS_ENABLED:true}
    }
}
