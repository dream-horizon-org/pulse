buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['PulseReactNativeOtel_' + name]
  }
  ext.kotlin_version = '1.9.25'
  ext.kotlinVersion = '1.9.25'

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["PulseReactNativeOtel_" + name]).toInteger()
}

android {
  namespace "com.pulsereactnativeotel"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
      consumerProguardFiles 'proguard-rules.pro'
    }
    debug {
      consumerProguardFiles 'proguard-rules.pro'
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

// Add Kotlin compiler options: set Kotlin language version and jvm target to 1.8

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
  kotlinOptions {
    languageVersion = "1.8"
  }
}

repositories {
  mavenCentral()
  google()
}

def pulse_version = "0.0.16-alpha"
dependencies {
  implementation("com.facebook.react:react-android")

  api("org.dreamhorizon:pulse-android-api:$pulse_version")
  api("org.dreamhorizon:android-agent:$pulse_version") {
    exclude group: "com.squareup.okhttp3", module: "okhttp-jvm"
  }
  api("org.dreamhorizon:pulse-android-sdk-internal:$pulse_version") {
    exclude group: "com.squareup.okhttp3", module: "okhttp-jvm"
  }
  api("org.dreamhorizon:pulse-utils:$pulse_version")
  implementation("org.dreamhorizon:pulse-semconv:$pulse_version")
  implementation("org.dreamhorizon:pulse-sampling-models:$pulse_version")
  api("com.squareup.okhttp3:okhttp:5.0.0-alpha.14")
  implementation("io.opentelemetry:opentelemetry-sdk")
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

  // Cap Kotlin runtime artifacts below the Kotlin 2.1 metadata boundary so consumers
  // compiling with Kotlin 1.9.x (which can read metadata up to 2.0.x) can still read them.
  // Uses an upper-bound range rather than a single version so consumers' own BOM-pinned
  // Kotlin 2.0.x stdlib / kotlinx-serialization 1.7.x can still satisfy the constraint.
  // Without this, transitive pulse-* artifacts pull in Kotlin 2.1 stdlib/coroutines/serialization,
  // whose .kotlin_module metadata is unreadable by a 1.9.x compiler.
  constraints {
    def capBelow = { String coord, String range ->
      api(coord) { version { strictly(range) } }
    }
    capBelow("org.jetbrains.kotlin:kotlin-stdlib",                  "[1.9, 2.1)")
    capBelow("org.jetbrains.kotlin:kotlin-stdlib-jdk7",             "[1.9, 2.1)")
    capBelow("org.jetbrains.kotlin:kotlin-stdlib-jdk8",             "[1.9, 2.1)")
    capBelow("org.jetbrains.kotlin:kotlin-stdlib-common",           "[1.9, 2.1)")
    capBelow("org.jetbrains.kotlinx:kotlinx-coroutines-core",       "[1.8, 1.10)")
    capBelow("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm",   "[1.8, 1.10)")
    capBelow("org.jetbrains.kotlinx:kotlinx-coroutines-android",    "[1.8, 1.10)")
    capBelow("org.jetbrains.kotlinx:kotlinx-serialization-core",      "[1.6, 1.8)")
    capBelow("org.jetbrains.kotlinx:kotlinx-serialization-core-jvm",  "[1.6, 1.8)")
    capBelow("org.jetbrains.kotlinx:kotlinx-serialization-json",      "[1.6, 1.8)")
    capBelow("org.jetbrains.kotlinx:kotlinx-serialization-json-jvm",  "[1.6, 1.8)")
  }
}
