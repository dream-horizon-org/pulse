buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['PulseReactNativeOtel_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["PulseReactNativeOtel_" + name]).toInteger()
}

android {
  namespace "com.pulsereactnativeotel"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
      consumerProguardFiles 'proguard-rules.pro'
    }
    debug {
      consumerProguardFiles 'proguard-rules.pro'
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

kotlin {
  explicitApi()
}

repositories {
  mavenCentral()
  google()
  mavenCentral()
}

// Match the Kotlin Gradle plugin version used by the host app (RN/Expo often uses 1.9.x). Prevents kotlin-stdlib 2.1+ on the classpath when compiled with 1.9.
def pulseKotlinCompilerVersion = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion").toString()
    : (project.findProperty("PulseReactNativeOtel_kotlinVersion") ?: "1.9.25").toString()
def pulseKotlinIs19Family = pulseKotlinCompilerVersion.startsWith("1.9")
def kotlinxSerializationVersion = pulseKotlinIs19Family ? "1.6.3" : "1.8.0"
def kotlinxCoroutinesAlignedVersion = pulseKotlinIs19Family ? "1.8.1" : "1.10.2"

configurations.configureEach {
  resolutionStrategy.eachDependency { details ->
    def requested = details.requested
    if (requested.group == "org.jetbrains.kotlin") {
      details.useVersion(pulseKotlinCompilerVersion)
      details.because("pulse-react-native-android aligns Kotlin artifacts with host compiler ($pulseKotlinCompilerVersion)")
    }
    if (requested.group == "org.jetbrains.kotlinx") {
      if (requested.name.contains("kotlinx-coroutines")) {
        details.useVersion(kotlinxCoroutinesAlignedVersion)
        details.because("pulse-react-native-android aligns coroutines for Kotlin ${pulseKotlinIs19Family ? '1.9' : '2.x'} consumers")
      }
      if (requested.name.contains("kotlinx-serialization")) {
        details.useVersion(kotlinxSerializationVersion)
        details.because("pulse-react-native-android aligns kotlinx-serialization for Kotlin ${pulseKotlinIs19Family ? '1.9' : '2.x'} consumers")
      }
    }
  }
}

// Keep aligned with pulse-android-otel gradle.properties `version` + "-alpha" (with publishToMavenLocal -Pfinal=true).
def pulse_version = "0.0.16-alpha"
dependencies {
  implementation("com.facebook.react:react-android")

  api("org.dreamhorizon:pulse-android-api:$pulse_version")
  api("org.dreamhorizon:android-agent:$pulse_version") {
    exclude group: "com.squareup.okhttp3", module: "okhttp-jvm"
  }
  api("org.dreamhorizon:pulse-android-sdk-internal:$pulse_version") {
    exclude group: "com.squareup.okhttp3", module: "okhttp-jvm"
  }
  api("org.dreamhorizon:pulse-utils:$pulse_version")
  implementation("org.dreamhorizon:pulse-semconv:$pulse_version")
  implementation("org.dreamhorizon:pulse-sampling-models:$pulse_version")
  api("com.squareup.okhttp3:okhttp:5.0.0-alpha.14")
  implementation("io.opentelemetry:opentelemetry-sdk")
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion")
}
