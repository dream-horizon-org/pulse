# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: pulse-mcp tool-selection eval (Gemini 2.5 Flash via Google ADK; full agentic loop)
# 64 test cases: 58 NL eval cases + 6 SCN scenarios
# Prerequisites:
#   - yarn build  (compiles dist/index.js — the MCP server)
#   - GOOGLE_API_KEY or GEMINI_API_KEY — for Gemini
#   - PULSE_BASE_URL, PULSE_API_KEY — passed to the MCP server at eval time
# Run from pulse-mcp/: yarn promptfoo:eval

providers:
  - id: file://providers/gemini-adk-agent.mjs
    config:
      model: gemini-2.5-flash
      instruction: >
        You are an assistant for Pulse, a real-time mobile and web observability
        platform. You have access to Pulse MCP tools via function declarations.
        When the user makes a request, call the appropriate tool(s) to answer it.
        Call only the tools that are needed.
        Use projectId "fancode" unless the user specifies otherwise.
      max_turns: 10
      mcp:
        servers:
          - command: node
            args: ['dist/index.js']
            name: pulse-mcp
            env:
              PULSE_BASE_URL: '{{env.PULSE_BASE_URL}}'
              PULSE_API_KEY: '{{env.PULSE_API_KEY}}'

prompts:
  - "{{prompt}}"

tests:
  # Smoke test — kept simple, no tool-calling expected
  - description: smoke_gemini_connectivity
    vars:
      prompt: "Reply with exactly this token and nothing else: MCP_EVAL_OK"
    assert:
      - type: contains
        value: MCP_EVAL_OK

  # Tool-selection eval suites
  - file://tests/01-single-tool.yaml
  - file://tests/02-multi-step.yaml
  - file://tests/03-semantic-traps.yaml
  - file://tests/04-distractor-traps.yaml
  - file://tests/05-disambiguation.yaml
  - file://tests/06-scenarios.yaml
