# Google ADK TypeScript provider — full agentic loop via MCP stdio.
#
# The provider builds a Gemini LlmAgent backed by MCPToolset, runs the full
# agentic loop with InMemoryRunner, and surfaces every tool call in
# metadata.toolCalls — same shape that tool-call-f1 and JS assertions expect.
#
# Prerequisites:
#   - yarn build  (pulse-mcp server must be compiled to dist/index.js)
#   - GOOGLE_API_KEY (or GEMINI_API_KEY) for Gemini
#   - PULSE_BASE_URL, PULSE_API_KEY — used by dist/index.js at startup
#
# Run from pulse-mcp/: yarn promptfoo:eval

- id: file://providers/gemini-adk-agent.mjs
  config:
    model: gemini-2.5-flash
    instruction: >
      You are an assistant for Pulse, a real-time mobile and web observability
      platform. You have access to Pulse MCP tools via function declarations.
      When the user makes a request, call the appropriate tool(s) to answer it.
      Call only the tools that are needed.
      Use projectId "fancode" unless the user specifies otherwise.
    max_turns: 10
    mcp:
      servers:
        - command: node
          args: ['dist/index.js']
          name: pulse-mcp
          env:
            PULSE_BASE_URL: '{{env.PULSE_BASE_URL}}'
            PULSE_API_KEY: '{{env.PULSE_API_KEY}}'
