# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Category 1 — Single-tool, unambiguous (EVAL-001 to 015)
# Grading: tool-call-f1 threshold 1 == multiset of called tools must match expected set
# exactly (no missing tools, no extras, no distractors from prior rubric).

- description: "EVAL-001 — List all projects [single]"
  vars:
    prompt: "List all the projects I have access to."
  assert:
    - type: tool-call-f1
      threshold: 1
      metric: pulse_tool_calls_f1
      value:
        - list_projects

- description: "EVAL-002 — Get a specific project [single]"
  vars:
    prompt: "Get the details of project fancode."
  assert:
    - type: tool-call-f1
      threshold: 1
      metric: pulse_tool_calls_f1
      value:
        - get_project

- description: "EVAL-003 — List project members [single]"
