name: Android SDK - CodeQL

# Static analysis (SAST) for Java/Kotlin + Actions YAML. Results: Security → Code scanning.
# Build is assembleDebug only, with androidTest APK assembly skipped (saves CI time; instrumented
# tests belong in android-sdk-pr-check / local runs — emulator connectedCheck was flaky here).
on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'pulse-android-otel/**'
      - '.github/workflows/android-sdk-codeql.yml'
  push:
    branches:
      - main
      - release/*
    paths:
      - 'pulse-android-otel/**'
      - '.github/workflows/android-sdk-codeql.yml'
  schedule:
    - cron: "29 13 * * 2"  # weekly at 13:29 UTC on Tuesday

permissions:
  contents: read

jobs:
  codeql:
    name: codeql-analyze
    permissions:
      contents: read
      actions: read  # for github/codeql-action/init to get workflow details
      security-events: write  # for github/codeql-action/analyze to upload SARIF results
    runs-on: ubuntu-latest
    env:
      ANDROID_PROJECT_DIR: ./pulse-android-otel
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: touch local props
        run: touch demo-app/local.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f443b600d91635bebf5b0d9ebc620189c0d6fba5 # v4.30.8
        with:
          languages: java, actions
          # using "linked" helps to keep up with the latest Kotlin support
          # (see https://github.com/github/codeql-action/issues/1555#issuecomment-1452228433
          #  and note that "latest" was renamed to "linked" in https://github.com/github/codeql-action/pull/2281)
          tools: linked

      - name: Assemble (debug, no androidTest APKs)
        # --no-build-cache / --no-daemon: required for CodeQL to observe compilation
        # assembleDebug: skip release variants vs full assemble
        # -x assembleDebugAndroidTest: skip every subproject's instrumented-test APK (heavy; caused long runs)
        run: ./gradlew assembleDebug -x assembleDebugAndroidTest --no-build-cache --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f443b600d91635bebf5b0d9ebc620189c0d6fba5 # v4.30.8
