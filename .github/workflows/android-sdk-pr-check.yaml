name: Android SDK - PR build

on:
  pull_request:
    paths:
      - 'pulse-android-otel/**'
      - '.github/workflows/android-sdk-pr-check.yaml'

permissions:
  contents: read

jobs:
  pr-checks:
    name: "pr-checks"
    runs-on: ubuntu-latest
    env:
      ANDROID_PROJECT_DIR: ./pulse-android-otel
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle build action
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: touch local props
        run: touch demo-app/local.properties
      # Each static-analysis task must be listed with its own -x; otherwise Gradle treats
      # names after the first -x as extra tasks to run (not exclusions), and detektDebug runs in CI.
      - name: run gradle
        run: ./gradlew check -x detekt detektDebug detektDebugUnitTest detektDebugAndroidTest :pulse-upload-plugin:detektMain koverXmlReport
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          slug: open-telemetry/opentelemetry-android

  demo-app-build:
    name: "demo-app-assemble"
    runs-on: ubuntu-latest
    env:
      ANDROID_PROJECT_DIR: ./pulse-android-otel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle build action
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: touch local props
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: touch demo-app/local.properties
      - name: build demo app
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}/demo-app
        run: ./gradlew assembleRelease

  required-status-check:
    needs:
      - pr-checks
      - demo-app-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ needs.pr-checks.result != 'success' || needs.demo-app-build.result != 'success' }}
        run: exit 1
