name: Android SDK - Build

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'pulse-android-otel/**'
      - '.github/workflows/android-sdk-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Dorg.gradle.configuration-cache=false"
    defaults:
      run:
        working-directory: ./pulse-android-otel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle build action
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: touch local props
        run: touch demo-app/local.properties
      - name: run gradle check and coverage
        # Same exclusions/CC workaround as android-sdk-pr-check.yaml (Gradle CLI parses multiple -x correctly).
        run: ./gradlew check koverXmlReport --no-configuration-cache -x detekt -x detektDebug -x detektDebugUnitTest -x detektDebugAndroidTest -x :pulse-upload-plugin:detektMain
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          slug: dream-horizon-org/pulse
      # Snapshot publish was previously a commented step here; use a dedicated job with
      # working-directory pulse-android-otel and ./gradlew publishToSonatype when ready.

  demo-app:
    name: demo-app
    runs-on: ubuntu-latest
    env:
      ANDROID_PROJECT_DIR: ./pulse-android-otel
      JAVA_OPTS: "-Dorg.gradle.configuration-cache=false"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle build action
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: touch local props
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: touch demo-app/local.properties
      - name: build demo app
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}/demo-app
        run: ./gradlew assemble --no-configuration-cache

  workflow-notification:
    permissions: # required by the reusable workflow
      contents: read
      issues: write
    needs:
      - verify
      - demo-app
    if: always() && github.run_attempt == 1 && (needs.verify.result == 'failure' || needs.demo-app.result == 'failure')
    uses: ./.github/workflows/reusable-workflow-notification.yml
    with:
      success: ${{ needs.verify.result == 'success' && needs.demo-app.result == 'success' }}

  required-status-check:
    permissions:
      contents: read
      issues: write
    needs:
      - verify
      - demo-app
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ needs.verify.result != 'success' || needs.demo-app.result != 'success' }}
        run: exit 1
