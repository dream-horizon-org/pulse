name: Web SDK — Lint, Unit Tests & E2E

on:
  pull_request:
    paths:
      - "pulse-web-otel/src/**"
      - "pulse-web-otel/examples/**"
      - "pulse-web-otel/package.json"
      - "pulse-web-otel/yarn.lock"
      - "pulse-web-otel/scripts/ci-pr-checks.sh"
      - ".github/workflows/web-sdk-checks.yml"
  push:
    branches:
      - main
    paths:
      - "pulse-web-otel/src/**"
      - "pulse-web-otel/examples/**"
      - "pulse-web-otel/package.json"
      - "pulse-web-otel/yarn.lock"
      - "pulse-web-otel/scripts/ci-pr-checks.sh"
      - ".github/workflows/web-sdk-checks.yml"

permissions:
  contents: read

concurrency:
  group: web-sdk-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-sdk-checks:
    name: lint · vitest · e2e gates · nextjs e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pulse-web-otel

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: pulse-web-otel/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: |
          yarn workspace ecommerce-demo exec playwright install chromium --with-deps
          yarn workspace nextjs-demo exec playwright install chromium --with-deps

      - name: Run Web SDK PR checks
        run: bash scripts/ci-pr-checks.sh
        env:
          CI: "true"
