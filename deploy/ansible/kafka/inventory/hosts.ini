# Static inventory — update when brokers are added or removed.
# node_id must match the KRaft node.id in server.properties.
# This file is also updated automatically by the add/remove Jenkins jobs.

[kafka_brokers]
pulse-kafka-01.pulse.local  node_id=1
pulse-kafka-02.pulse.local  node_id=2

pulse-kafka-03.pulse.local  node_id=3
[kafka_brokers:vars]
ansible_user=admin
ansible_ssh_extra_args=-o StrictHostKeyChecking=no
# ansible_ssh_private_key_file is injected at runtime via Jenkins withCredentials
