---
# configure-broker.yml
#
# Configures Kafka (KRaft combined mode) on one or more broker hosts.
# Safe to run multiple times — all tasks are idempotent.
#
# Required extra_vars (passed by Jenkins):
#   kraft_cluster_id   – KRaft cluster UUID (base64, URL-safe, no padding)
#                        Stored in SSM: /pulse/kafka/production/kraft_cluster_id
#   num_brokers        – total number of brokers in the cluster
#   route53_zone_name  – private hosted zone name, e.g. pulse.local
#
# Optional extra_vars:
#   process_roles      – "broker,controller" (default) or "broker"
#   target_hosts       – which inventory group to target (default: kafka_brokers)
#
# Example:
#   ansible-playbook configure-broker.yml \
#     -i inventory/hosts.ini \
#     -e kraft_cluster_id=<id> \
#     -e num_brokers=2 \
#     -e route53_zone_name=pulse.local

- name: Configure Kafka brokers
  hosts: "{{ target_hosts | default('kafka_brokers') }}"
  become: true
  vars:
    process_roles: "broker,controller"

  tasks:
    # ------------------------------------------------------------------
    # 1. Mount dedicated EBS data disk
    # ------------------------------------------------------------------
    - name: Create data directory
      file:
        path: "{{ kafka_data_dir }}"
        state: directory
        mode: "0755"

    - name: Find data disk (exclude root device)
      shell: |
        ROOT_SRC="$(findmnt -n -o SOURCE /)"
        ROOT_DISK="$(lsblk -no PKNAME "$ROOT_SRC" 2>/dev/null || basename "$ROOT_SRC" | sed 's/p[0-9]*$//')"
        lsblk -ndo NAME,TYPE | while read name type; do
          [ "$type" != "disk" ] && continue
          [ "$name" = "$ROOT_DISK" ] && continue
          echo "/dev/$name"
          break
        done
      register: data_disk_result
      changed_when: false

    - name: Fail if no data disk found
      fail:
        msg: "No secondary data disk found. Check that the EBS volume is attached."
      when: data_disk_result.stdout == ""

    - name: Format data disk as ext4 (only if not already formatted)
      filesystem:
        fstype: ext4
        dev: "{{ data_disk_result.stdout }}"

    - name: Mount data disk
      mount:
        path: "{{ kafka_data_dir }}"
        src: "{{ data_disk_result.stdout }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Create Kafka log directory inside data disk
      file:
        path: "{{ kafka_log_dir }}"
        state: directory
        mode: "0755"

    # ------------------------------------------------------------------
    # 2. Build controller.quorum.voters string
    #    Format: 1@pulse-kafka-01.zone:9093,2@pulse-kafka-02.zone:9093,...
    # ------------------------------------------------------------------
    - name: Build quorum voters string
      shell: |
        QUORUM=""
        for i in $(seq 1 {{ num_brokers }}); do
          IDX=$(printf "%02d" $i)
          ENTRY="${i}@pulse-kafka-${IDX}.{{ route53_zone_name }}:9093"
          QUORUM="${QUORUM:+$QUORUM,}$ENTRY"
        done
        echo "$QUORUM"
      register: quorum_result
      changed_when: false

    # ------------------------------------------------------------------
    # 3. Write server.properties
    # ------------------------------------------------------------------
    - name: Create KRaft config directory
      file:
        path: "{{ kafka_dir }}/config/kraft"
        state: directory
        mode: "0755"

    - name: Write server.properties
      copy:
        dest: "{{ kafka_dir }}/config/kraft/server.properties"
        mode: "0644"
        content: |
          # KRaft — process.roles={{ process_roles }}
          process.roles={{ process_roles }}
          node.id={{ node_id }}

          # Cluster membership
          controller.quorum.voters={{ quorum_result.stdout }}

          # Listeners
          listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=INTERNAL

          listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          advertised.listeners=INTERNAL://pulse-kafka-{{ '%02d' | format(node_id | int) }}.{{ route53_zone_name }}:9092

          # Storage
          log.dirs={{ kafka_log_dir }}

          # Replication defaults
          default.replication.factor={{ replication_factor }}
          min.insync.replicas={{ min_insync_replicas }}
          offsets.topic.replication.factor={{ replication_factor }}
          transaction.state.log.replication.factor={{ replication_factor }}
          transaction.state.log.min.isr={{ min_insync_replicas }}

          # Retention
          log.retention.ms={{ retention_ms }}
          log.retention.check.interval.ms=300000
          log.segment.bytes=1073741824

          # Producer defaults
          compression.type={{ compression_type }}

          # Performance
          num.network.threads=3
          num.io.threads=8
          socket.send.buffer.bytes=102400
          socket.receive.buffer.bytes=102400
          socket.request.max.bytes=104857600
      notify: restart kafka

    # ------------------------------------------------------------------
    # 4. Format KRaft storage — runs only once (marker file guards it)
    # ------------------------------------------------------------------
    - name: Check if KRaft storage already formatted
      stat:
        path: "{{ kafka_log_dir }}/.kraft_formatted"
      register: kraft_marker

    - name: Format KRaft storage
      shell: |
        "{{ kafka_dir }}/bin/kafka-storage.sh" format \
          -t "{{ kraft_cluster_id }}" \
          -c "{{ kafka_dir }}/config/kraft/server.properties"
        touch "{{ kafka_log_dir }}/.kraft_formatted"
      when: not kraft_marker.stat.exists

    # ------------------------------------------------------------------
    # 5. Systemd service
    # ------------------------------------------------------------------
    - name: Write kafka.service unit
      copy:
        dest: /etc/systemd/system/kafka.service
        mode: "0644"
        content: |
          [Unit]
          Description=Apache Kafka {{ kafka_version }} (KRaft) — node {{ node_id }}
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ kafka_dir }}
          Environment="KAFKA_HEAP_OPTS=-Xmx4g -Xms4g"
          ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/kraft/server.properties
          ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=100000

          [Install]
          WantedBy=multi-user.target
      notify: reload systemd

    - name: Enable and start kafka
      systemd:
        name: kafka
        enabled: true
        state: started
        daemon_reload: true

    # ------------------------------------------------------------------
    # 6. Wait for Kafka to accept connections
    # ------------------------------------------------------------------
    - name: Wait for Kafka to be ready
      shell: "{{ kafka_dir }}/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
      register: kafka_ready
      retries: 30
      delay: 5
      until: kafka_ready.rc == 0
      changed_when: false

    # ------------------------------------------------------------------
    # 7. Create topics — runs only on node 1, idempotent
    # ------------------------------------------------------------------
    - name: Create Kafka topics
      shell: |
        "{{ kafka_dir }}/bin/kafka-topics.sh" \
          --bootstrap-server localhost:9092 \
          --create --if-not-exists \
          --topic "{{ item.name }}" \
          --partitions {{ item.partitions }} \
          --replication-factor {{ replication_factor }} \
          --config retention.ms={{ retention_ms }} \
          --config compression.type={{ compression_type }} \
          --config min.insync.replicas={{ min_insync_replicas }}
      loop: "{{ kafka_topics }}"
      when: node_id | int == 1
      changed_when: true

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart kafka
      systemd:
        name: kafka
        state: restarted
