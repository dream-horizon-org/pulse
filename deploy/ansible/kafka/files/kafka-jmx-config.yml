---
# JMX Exporter config for Kafka brokers.
# Exposes Prometheus metrics on port 7071.
# Reference: https://github.com/prometheus/jmx_exporter

lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # ----------------------------------------------------------------
  # Broker topic metrics — per topic
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.server<type=BrokerTopicMetrics,
      name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|
            ReplicationBytesInPerSec|ReplicationBytesOutPerSec|
            FailedProduceRequestsPerSec|FailedFetchRequestsPerSec|
            TotalProduceRequestsPerSec|TotalFetchRequestsPerSec),
      topic=(.+)><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_$1_rate
    labels:
      topic: "$2"
    type: GAUGE

  # Broker topic metrics — cluster-wide totals
  - pattern: >-
      kafka.server<type=BrokerTopicMetrics,
      name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|
            ReplicationBytesInPerSec|ReplicationBytesOutPerSec|
            FailedProduceRequestsPerSec|FailedFetchRequestsPerSec)><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_$1_rate
    type: GAUGE

  # ----------------------------------------------------------------
  # Replica Manager — partition health
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.server<type=ReplicaManager,
      name=(UnderReplicatedPartitions|UnderMinIsrPartitionCount|
            AtMinIsrPartitionCount|OfflineReplicaCount|
            LeaderCount|PartitionCount)><>Value
    name: kafka_server_replicamanager_$1
    type: GAUGE

  - pattern: >-
      kafka.server<type=ReplicaManager,
      name=(IsrShrinksPerSec|IsrExpandsPerSec)><>OneMinuteRate
    name: kafka_server_replicamanager_$1_rate
    type: GAUGE

  # ----------------------------------------------------------------
  # Controller — cluster-level health
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.controller<type=KafkaController,
      name=(ActiveControllerCount|OfflinePartitionsCount|
            PreferredReplicaImbalanceCount|GlobalTopicCount|
            GlobalPartitionCount)><>Value
    name: kafka_controller_kafkacontroller_$1
    type: GAUGE

  - pattern: >-
      kafka.controller<type=ControllerStats,
      name=(UncleanLeaderElectionsPerSec|LeaderElectionRateAndTimeMs)><>OneMinuteRate
    name: kafka_controller_controllerstats_$1_rate
    type: GAUGE

  # ----------------------------------------------------------------
  # Network — request latency and throughput
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.network<type=RequestMetrics,
      name=RequestsPerSec,
      request=(.+),
      version=(.+)><>OneMinuteRate
    name: kafka_network_requestmetrics_requests_per_sec
    labels:
      request: "$1"
      version: "$2"
    type: GAUGE

  - pattern: >-
      kafka.network<type=RequestMetrics,
      name=(TotalTimeMs|RequestQueueTimeMs|ResponseQueueTimeMs|ThrottleTimeMs),
      request=(.+)><>(Mean|99thPercentile)
    name: kafka_network_requestmetrics_$1
    labels:
      request: "$2"
      quantile: "$3"
    type: GAUGE

  # ----------------------------------------------------------------
  # Request handler pool — broker saturation
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.server<type=KafkaRequestHandlerPool,
      name=RequestHandlerAvgIdlePercent><>OneMinuteRate
    name: kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent
    type: GAUGE

  - pattern: >-
      kafka.network<type=SocketServer,
      name=NetworkProcessorAvgIdlePercent><>Value
    name: kafka_network_socketserver_networkprocessoravgidlepercent
    type: GAUGE

  # ----------------------------------------------------------------
  # Purgatory — delayed produce/fetch queue depth
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.server<type=DelayedOperationPurgatory,
      name=PurgatorySize,
      delayedOperation=(.+)><>Value
    name: kafka_server_delayedoperationpurgatory_purgatorysize
    labels:
      delayed_operation: "$1"
    type: GAUGE

  # ----------------------------------------------------------------
  # Log manager — offline log dirs, topic size
  # ----------------------------------------------------------------
  - pattern: >-
      kafka.log<type=LogManager,
      name=OfflineLogDirectoryCount><>Value
    name: kafka_log_logmanager_offlinelogdirectorycount
    type: GAUGE

  - pattern: >-
      kafka.log<type=Log,
      name=Size,
      topic=(.+),
      partition=(.+)><>Value
    name: kafka_log_log_size_bytes
    labels:
      topic: "$1"
      partition: "$2"
    type: GAUGE

  # ----------------------------------------------------------------
  # JVM — heap, GC, OS
  # ----------------------------------------------------------------
  - pattern: java.lang<type=Memory><HeapMemoryUsage>(used|max|committed)
    name: java_lang_memory_heapmemoryusage_$1_bytes
    type: GAUGE

  - pattern: >-
      java.lang<type=GarbageCollector,
      name=(.+)><>CollectionCount
    name: java_lang_gc_collection_count_total
    labels:
      gc: "$1"
    type: COUNTER

  - pattern: >-
      java.lang<type=GarbageCollector,
      name=(.+)><>CollectionTime
    name: java_lang_gc_collection_time_ms_total
    labels:
      gc: "$1"
    type: COUNTER

  - pattern: >-
      java.lang<type=OperatingSystem><>(SystemCpuLoad|ProcessCpuLoad|
      OpenFileDescriptorCount|MaxFileDescriptorCount)
    name: java_lang_operatingsystem_$1
    type: GAUGE

  - pattern: java.lang<type=Threading><>(ThreadCount|DaemonThreadCount)
    name: java_lang_threading_$1
    type: GAUGE
