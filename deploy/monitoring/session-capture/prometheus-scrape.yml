# Pulse session-capture — Prometheus scrape job
#
# Uses AWS EC2 service discovery — Prometheus auto-discovers every running EC2
# instance tagged `component_name=pulse-session-capture` + `environment_name=production`
# in ap-south-1 and scrapes each on port 3400. ASG scaling, instance refresh, and
# IP changes need NO config edits.
#
# Do NOT scrape the NLB/Route53 hostname for metrics: each request is load-balanced,
# so each scrape hits a random instance — time series flicker and rates/alerts break.
#
# Prerequisites on the Prometheus host:
#   1. IAM role with: ec2:DescribeInstances, ec2:DescribeAvailabilityZones
#   2. Network reachability to session-capture instances on TCP 3400
#      (session-capture SG must allow inbound 3400 from Prometheus SG/CIDR)
#
# Paste this `- job_name:` block into your existing `scrape_configs:` list, then
# reload Prometheus:
#   curl -X POST http://localhost:9090/-/reload    # if --web.enable-lifecycle is set
#   sudo systemctl reload prometheus               # otherwise
#
# Verify: Prometheus UI → Status → Targets → both instances UP.

- job_name: pulse_session_capture
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http

  ec2_sd_configs:
    - region: ap-south-1
      port: 3400
      filters:
        - name: tag:component_name
          values: [ pulse-session-capture ]
        - name: tag:environment_name
          values: [ production ]
        - name: instance-state-name
          values: [ running ]

  relabel_configs:
    # defense in depth — keep only matching instances
    - source_labels: [ __meta_ec2_tag_component_name ]
      regex: pulse-session-capture
      action: keep
    # private IP → instance label
    - source_labels: [ __meta_ec2_private_ip ]
      target_label: instance
    # tags → labels
    - source_labels: [ __meta_ec2_tag_environment_name ]
      target_label: env
    - target_label: service
      replacement: pulse-session-capture

# Aggregating in Grafana/PromQL across replicas (optional):
#   sum(rate(http_requests_total{service="pulse-session-capture"}[5m]))
#   sum(capture_events_received_total{service="pulse-session-capture"})
