# ---------------------------------------------------------------------------
# Kafka monitoring — Prometheus scrape config
#
# Add both blocks under the `scrape_configs:` section in your prometheus.yml
# ---------------------------------------------------------------------------

  # Kafka JMX metrics (port 7071)
  - job_name: 'kafka'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'pulse-kafka-01.pulse.local:7071'
          - 'pulse-kafka-02.pulse.local:7071'
        labels:
          cluster: 'pulse-production'
          env: 'production'
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+)\.pulse\.local:\d+'
        target_label: broker
        replacement: '$1'

  # Node exporter — OS metrics (port 9100)
  - job_name: 'kafka-nodes'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'pulse-kafka-01.pulse.local:9100'
          - 'pulse-kafka-02.pulse.local:9100'
        labels:
          cluster: 'pulse-production'
          env: 'production'
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+)\.pulse\.local:\d+'
        target_label: broker
        replacement: '$1'

  # kafka_exporter — consumer group lag (port 9308, runs on Prometheus EC2)
  - job_name: 'kafka-consumer-lag'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - 'localhost:9308'
        labels:
          cluster: 'pulse-production'
          env: 'production'
