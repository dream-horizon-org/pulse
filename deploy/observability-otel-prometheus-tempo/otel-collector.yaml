# OTLP in → Prometheus exposition on :8889 (Prometheus scrapes this) + OTLP traces → Tempo.
# spanmetrics: RED-style metrics from traces (route/path when present on spans).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3001"
            - "http://127.0.0.1:3001"
            - "http://localhost:3002"
            - "http://localhost:3003"
          allowed_headers:
            - "Content-Type"
            - "Content-Encoding"
            - "X-API-KEY"
            - "X-Pulse-Metering-Session-ID"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 1024
    timeout: 1s
  # Placeholder — filter removed to diagnose which spans carry http.route.
  # Re-add once span names with routes are confirmed.
  filter/http_server:
    error_mode: ignore
    traces:
      span:
        - 'name == "__no_match__"'

connectors:
  spanmetrics:
    namespace: trace
    histogram:
      explicit:
        buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: url.path
      - name: http.response.status_code
    metrics_flush_interval: 15s
    exemplars:
      enabled: true

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    const_labels:
      cluster: local
    # Adds Resource attributes (e.g. host.name from the SDK) as metric labels when present.
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, filter/http_server]
      exporters: [otlp/tempo, spanmetrics]
