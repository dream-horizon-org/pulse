global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/pulse-otel.yml

scrape_configs:
  - job_name: obs_otel_collector
    static_configs:
      - targets: ["obs_otel_collector:8889"]
        labels:
          scrape_source: otel

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
