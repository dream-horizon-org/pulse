services:
  pulse-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-ai-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount entire agent source for hot reload — code changes reflect without rebuild
      # Not read-only because ADK writes session data to .adk/ (gitignored)
      - .:/app/pulse_ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
